version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sunlight-postgres
    environment:
      POSTGRES_USER: sunlight
      POSTGRES_PASSWORD: sunlight
      POSTGRES_DB: sunlight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sunlight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
